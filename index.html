<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkDesk</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast"></div>

<section id="authScreen" class="screen">
  <div class="auth-card">
    <h1>WorkDesk</h1><p class="muted">Your personal productivity workspace</p>
    <div class="tabs"><button class="tab active" data-auth="login">Login</button><button class="tab" data-auth="register">Create Account</button></div>
    <form id="loginForm" class="auth-form">
      <label>User ID / Username</label><input id="loginUser" required>
      <label>Password</label><div class="password"><input id="loginPassword" type="password" required><button type="button" class="show" data-target="loginPassword">Show</button></div>
      <button class="primary">Login</button><p id="loginError" class="error"></p>
    </form>
    <form id="registerForm" class="auth-form hidden">
      <label>User ID / Username</label><input id="regUser" required>
      <label>Password</label><input id="regPassword" type="password" required>
      <label>Confirm Password</label><input id="regConfirm" type="password" required>
      <button class="primary">Create Account</button><p id="registerError" class="error"></p>
    </form>
  </div>
</section>

<section id="welcomeScreen" class="screen hidden"><div class="welcome"><div class="spinner"></div><h1 id="welcomeText">Welcome</h1><p>Preparing your workspace...</p></div></section>

<section id="appScreen" class="app hidden">
  <aside class="sidebar">
    <h2>WorkDesk</h2>
    <nav>
      <button class="nav active" data-page="overview">Overview</button>
      <button class="nav" data-page="tasks">Tasks</button>
      <button class="nav" data-page="private">🔒 Private Tasks</button>
      <button class="nav" data-page="reminders">Task Reminder</button>
      <button class="nav" data-page="notifications">Notifications</button>
      <button class="nav" data-page="notes">Notes</button>
      <button class="nav" data-page="calendar">Calendar</button>
      <button class="nav" data-page="settings">Settings</button>
    </nav>
    <button id="logout" class="nav logout">Logout</button>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="head-left"><h2 id="pageTitle">Overview</h2>
        <div class="search"><span>⌕</span><input id="search" placeholder="Search tasks, notes and reminders..."><div id="results" class="results hidden"></div></div>
      </div>
      <div class="actions"><button id="bell" class="icon">🔔<b id="count">0</b></button><button id="theme" class="icon">☾</button><button id="profile" class="profile"></button></div>
    </header>
    <div id="content" class="content"></div>
  </main>
</section>
<div id="modal"></div>
<script src="script.js"></script>
</body></html>
